name: Build and Release ALTRun v2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v(\d+\.\d+\.\d+.*)$') {
            $version = $Matches[1]
          } else {
            $version = "2.0.0"
          }
          Write-Host "Releasing version: $version"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore Dependencies
        run: dotnet restore ALTRun-v2/ALTRun.csproj

      - name: Build Framework-Dependent Single-File (~560KB)
        run: >
          dotnet publish ALTRun-v2/ALTRun.csproj
          -c Release
          -r win-x64
          --no-self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ env.VERSION }}
          -o publish-fd

      - name: Build Self-Contained Standalone Single-File (Zero Runtime Dependency)
        run: >
          dotnet publish ALTRun-v2/ALTRun.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ env.VERSION }}
          -o publish-sc

      - name: Package Release Archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          
          # 1. 复制独立单文件可执行程序
          Copy-Item "publish-fd/ALTRun.exe" -Destination "release-assets/ALTRun.exe"
          Copy-Item "publish-sc/ALTRun.exe" -Destination "release-assets/ALTRun-SelfContained.exe"
          
          # 2. 压缩轻量绿色版 zip (需已安装 .NET 8 桌面运行时)
          New-Item -ItemType Directory -Force -Path "zip-fd/ALTRun"
          Copy-Item "publish-fd/ALTRun.exe" -Destination "zip-fd/ALTRun/"
          Copy-Item "README.md" -Destination "zip-fd/ALTRun/"
          Compress-Archive -Path "zip-fd/ALTRun/*" -DestinationPath "release-assets/ALTRun-v${{ env.VERSION }}-win-x64.zip" -Force
          
          # 3. 压缩免安装独立运行版 zip (包含完整运行时，开箱即用)
          New-Item -ItemType Directory -Force -Path "zip-sc/ALTRun"
          Copy-Item "publish-sc/ALTRun.exe" -Destination "zip-sc/ALTRun/ALTRun.exe"
          Copy-Item "README.md" -Destination "zip-sc/ALTRun/"
          Compress-Archive -Path "zip-sc/ALTRun/*" -DestinationPath "release-assets/ALTRun-v${{ env.VERSION }}-win-x64-SelfContained.zip" -Force

          # 4. 生成统一 Release 说明文档
          $lines = @(
            '### 📦 发布文件下载指引 (Release Assets Guide)',
            '',
            '| 附件文件 | 文件类型 | 说明与适用场景 |',
            '| :--- | :--- | :--- |',
            "| 🚀 **``ALTRun-v$($env:VERSION)-win-x64.zip``** | 压缩包 (~230 KB) | **极速轻量绿色版 (强烈推荐)**：解压即用，需系统已安装 [.NET 8 桌面运行时](https://dotnet.microsoft.com/download/dotnet/8.0) |",
            '| ⚡ **``ALTRun.exe``** | 单文件 (~560 KB) | **极速轻量单文件版**：无需解压直接双击运行，需 .NET 8 桌面运行时 |',
            "| 📦 **``ALTRun-v$($env:VERSION)-win-x64-SelfContained.zip``** | 压缩包 (~66 MB) | **免安装独立运行版**：内置完整独立运行时，任意 Windows 10/11 电脑**开箱即用，无需安装任何运行库** |",
            '| 🛡️ **``ALTRun-SelfContained.exe``** | 单文件 (~71 MB) | **独立运行版单文件程序**：零依赖独立单文件，随身 U 盘或纯净新装系统首选 |',
            '',
            '---',
            '',
            '### 🌟 核心特性与更新 (Features)',
            '- 采用 **Windows 11 Fluent Design**（原生圆角、DWM 深度渲染阴影、多主题配色）；',
            '- 提供 **12 款精调主题风格（5 款暗色 + 7 款亮色）**，告别单调蓝黑灰；',
            '- 支持 **拼音首字母模糊检索**（如 ``jsq`` / ``calc`` $\to$ 计算器，``snip`` $\to$ 截图工具）；',
            '- **开机自动运行双重保障**：自动创建 Windows 启动文件夹快捷方式与注册表项；',
            '- 彻底解决 Win11 剪贴板竞争与 OLE 弹窗报错；',
            '- 优化空闲常驻内存管理，常驻内存仅数兆字节。'
          )
          $lines | Set-Content -Path "release-notes.md" -Encoding utf8

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: ALTRun v${{ env.VERSION }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: |
            release-assets/ALTRun-v${{ env.VERSION }}-win-x64.zip
            release-assets/ALTRun-v${{ env.VERSION }}-win-x64-SelfContained.zip
            release-assets/ALTRun.exe
            release-assets/ALTRun-SelfContained.exe

      - name: Force Sync Release Notes via GitHub CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "v$($env:VERSION)" }
          Write-Host "Syncing notes for release $tag"
          gh release edit $tag --notes-file release-notes.md
